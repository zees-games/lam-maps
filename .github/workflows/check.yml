name: Check

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

jobs:
    pack-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python3 tools/test_check_packs.py
            - run: bash tools/stage_packs.sh "$RUNNER_TEMP/packs"
